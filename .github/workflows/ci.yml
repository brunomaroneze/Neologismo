name: CI

# Portões de qualidade. Rodam em todo PR e em todo push para os branches
# principais, e o `workflow_call` deixa a pipeline de entrega (cd.yml) chamar
# este mesmo arquivo em vez de duplicar os passos — assim não existe caminho
# de deploy que pule a verificação.
on:
  push:
    # `main` fica de fora de propósito: o push para main entra pela pipeline
    # de entrega (cd.yml), que chama este workflow como primeira etapa. Se os
    # dois disparassem, as duas execuções cairiam no mesmo grupo de
    # `concurrency` e uma cancelaria a outra — às vezes justamente a que o
    # deploy estava esperando.
    branches: [develop]
  pull_request:
    branches: [main, develop]
  # Disparo manual pela aba Actions, em qualquer branch. Útil antes de abrir
  # o PR: o push numa branch de feature, por si só, não roda o CI — é de
  # propósito, para não gastar runner duas vezes no mesmo commit depois que
  # o PR existe.
  workflow_dispatch:
  workflow_call:
    inputs:
      pular_imagens:
        description: >-
          Pular o build das imagens Docker. O cd.yml passa `true` porque ele
          mesmo constrói e publica as imagens logo depois — buildar aqui
          também seria fazer o mesmo trabalho duas vezes no mesmo commit.
        type: boolean
        default: false

# Um push novo no mesmo branch cancela a execução anterior, em vez de manter
# duas rodando em paralelo pelo mesmo resultado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        # A imagem precisa casar com a de produção: o ArrayField de tags, o
        # filtro por tags e a extensão `unaccent` da busca são específicos do
        # Postgres.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neoscopio
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: neoscopio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neoscopio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEBUG: 'True'
      SECRET_KEY: chave-de-ci-sem-valor-em-producao
      DATABASE_URL: postgres://neoscopio:senha_ci@localhost:5432/neoscopio_test
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        # Só `check`: o `ruff format` reescreveria o projeto inteiro para
        # aspas duplas, e o estilo adotado aqui é consistente como está.
        run: ruff check . --output-format github

      - name: Checagem do sistema
        working-directory: backend
        run: python manage.py check

      - name: Migrações não têm alterações pendentes
        working-directory: backend
        # Pega o caso de alguém mudar models.py e esquecer de gerar a migração
        # — o deploy quebraria só na hora do migrate em produção.
        run: python manage.py makemigrations --check --dry-run

      - name: Testes com cobertura
        working-directory: backend
        run: coverage run manage.py test --verbosity 2

      - name: Cobertura mínima
        working-directory: backend
        # O piso (fail_under) está no pyproject.toml. Serve para a cobertura
        # não cair sem ninguém perceber, não como meta a perseguir.
        run: |
          coverage report
          coverage xml -o coverage-backend.xml

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage-backend.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Checklist de produção
        working-directory: backend
        env:
          DEBUG: 'False'
          SECRET_KEY: ${{ github.sha }}-${{ github.run_id }}-chave-longa-o-suficiente-para-o-check-passar
          ALLOWED_HOSTS: neoscopio.exemplo.com
          CORS_ALLOWED_ORIGINS: https://neoscopio.exemplo.com
          CSRF_TRUSTED_ORIGINS: https://neoscopio.exemplo.com
        # W021 (HSTS preload) é aceito de propósito: preload é irreversível e
        # a decisão está documentada no DEPLOY.md.
        run: python manage.py check --deploy --fail-level ERROR

      - name: Schema da API é válido
        working-directory: backend
        run: python manage.py spectacular --file /dev/null --validate

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Tipos
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testes
        working-directory: frontend
        run: npm run test:coverage

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        working-directory: frontend
        env:
          # Valor de fachada: o build só precisa de algo bem-formado, já que
          # NEXT_PUBLIC_* é embutido no bundle em tempo de compilação.
          NEXT_PUBLIC_API_URL: https://neoscopio.exemplo.com/api
          NEXT_PUBLIC_SITE_URL: https://neoscopio.exemplo.com
        run: npm run build

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: npm audit (falha em alta ou crítica)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: pip-audit (falha em qualquer CVE conhecida)
        working-directory: backend
        # As dependências do backend são poucas e bem conhecidas; aqui vale
        # ser estrito. `--strict` também falha se algum pacote não puder ser
        # auditado, para a varredura não passar em silêncio.
        run: |
          pip install -r requirements-dev.txt
          pip-audit --requirement requirements.txt --strict

  compose:
    name: Arquivos de Compose
    runs-on: ubuntu-latest
    # Job próprio, sem `needs`: validar YAML custa segundos e o erro aparece
    # junto com o lint, não depois de a suíte inteira rodar.

    steps:
      - uses: actions/checkout@v5

      - name: Compose de desenvolvimento é válido
        run: docker compose -f docker-compose.yml config --quiet

      - name: Compose de produção é válido
        env:
          DOMINIO: neoscopio.exemplo.com
          EMAIL_ACME: ci@exemplo.com
          SECRET_KEY: chave-de-ci
          POSTGRES_USER: neoscopio
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: neoscopio
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Override de deploy é válido
        env:
          DOMINIO: neoscopio.exemplo.com
          EMAIL_ACME: ci@exemplo.com
          SECRET_KEY: chave-de-ci
          POSTGRES_USER: neoscopio
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: neoscopio
          IMAGEM_BACKEND: ghcr.io/exemplo/neologismo-backend:ci
          IMAGEM_FRONTEND: ghcr.io/exemplo/neologismo-frontend:ci
        # É o arquivo que o cd.yml usa na VPS. Um erro de sintaxe aqui só
        # apareceria no meio de um deploy.
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.deploy.yml \
            config --quiet

  imagens:
    name: Imagens Docker de produção
    runs-on: ubuntu-latest
    # Só roda se o código já passou: buildar imagem de um commit quebrado é
    # gastar minuto de runner por nada.
    needs: [backend, frontend]
    # Em push e pull_request `inputs` não existe, então a condição é
    # verdadeira e o job roda normalmente.
    if: ${{ !inputs.pular_imagens }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: final
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: final
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://neoscopio.exemplo.com/api
            NEXT_PUBLIC_SITE_URL=https://neoscopio.exemplo.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
