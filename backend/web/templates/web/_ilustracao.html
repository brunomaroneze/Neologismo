{% comment %}
Ilustração da abertura: a formação de um neologismo. Partes conhecidas se
combinam (+) e dão origem a uma palavra nova, como num diagrama de
morfologia. As palavras vêm do acervo do Neoscópio.
{% endcomment %}
<svg class="ilustracao" viewBox="0 0 560 460" role="img" aria-labelledby="ilustracao-titulo">
  <title id="ilustracao-titulo">Diagrama de formação de neologismos: emoji mais -ficação forma emojificação; eco mais sexual forma ecossexual; pós mais coronavírus forma pós-coronavírus.</title>
  <defs>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#cc99cc" opacity="0.28"/>
    </pattern>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cc99cc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="560" height="460" fill="url(#pontos)"/>

  <!-- O balão da logo, ao fundo -->
  <g opacity="0.16" fill="none" stroke="#ffffff" stroke-width="10">
    <circle cx="410" cy="250" r="150"/>
    <path d="M488 118 L540 70 L520 140"/>
  </g>
  <g fill="#ffffff" opacity="0.16">
    <circle cx="362" cy="250" r="14"/><circle cx="410" cy="250" r="14"/><circle cx="458" cy="250" r="14"/>
  </g>

  <g font-family="Newsreader, Georgia, serif">
    <!-- emoji + -ficação -> emojificação -->
    <g class="ilustracao__linha">
      <rect x="20" y="52" rx="10" width="104" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="72" y="82" text-anchor="middle" font-size="22" fill="#ffffff">emoji</text>
      <text x="146" y="83" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="168" y="52" rx="10" width="118" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="227" y="82" text-anchor="middle" font-size="22" font-style="italic" fill="#ffffff">-ficação</text>
      <path d="M228 104 C 228 140, 250 150, 280 152" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="290" y="126" rx="12" width="210" height="52" fill="#ffffff"/>
      <text x="395" y="160" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">emojificação</text>
    </g>

    <!-- eco + sexual -> ecossexual -->
    <g class="ilustracao__linha">
      <rect x="20" y="214" rx="10" width="80" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="60" y="244" text-anchor="middle" font-size="22" font-style="italic" fill="#ffffff">eco-</text>
      <text x="120" y="245" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="140" y="214" rx="10" width="104" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="192" y="244" text-anchor="middle" font-size="22" fill="#ffffff">sexual</text>
      <path d="M250 237 L 282 237" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="290" y="211" rx="12" width="190" height="52" fill="#ffffff" opacity="0.94"/>
      <text x="385" y="245" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">ecossexual</text>
    </g>

    <!-- pós- + coronavírus -> pós-coronavírus -->
    <g class="ilustracao__linha">
      <rect x="20" y="330" rx="10" width="72" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="56" y="360" text-anchor="middle" font-size="22" font-style="italic" fill="#ffffff">pós-</text>
      <text x="112" y="361" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="132" y="330" rx="10" width="148" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="206" y="360" text-anchor="middle" font-size="22" fill="#ffffff">coronavírus</text>
      <path d="M206 382 C 206 410, 240 420, 280 414" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="290" y="390" rx="12" width="236" height="52" fill="#ffffff" opacity="0.88"/>
      <text x="408" y="424" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">pós-coronavírus</text>
    </g>
  </g>

  <!-- Marca do azul de apoio -->
  <circle cx="512" cy="132" r="6" fill="#99c5ff"/>
  <circle cx="494" cy="216" r="4" fill="#99c5ff" opacity="0.8"/>
</svg>
