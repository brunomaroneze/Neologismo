{% comment %}
Ilustração da abertura: a formação de um neologismo. Partes conhecidas se
combinam (+) e dão origem a uma palavra nova, como num diagrama de
morfologia. Ao fundo, o frasco da
logo (o "laboratório") e uma grade de pontos que se dissolve nas bordas.
{% endcomment %}
<svg class="ilustracao" viewBox="0 0 600 500" role="img" aria-labelledby="ilustracao-titulo">
  <title id="ilustracao-titulo">Diagrama de formação de neologismos: tesoura mais -aço forma tesouraço; cripto mais trambique forma criptotrambique; Faria Lima mais -er forma farialimer.</title>
  <defs>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#cc99cc" opacity="0.32"/>
    </pattern>
    <!-- A grade some aos poucos em direção às bordas: nada de "quadrado" de pontos. -->
    <radialGradient id="esmaecer" cx="50%" cy="50%" r="55%">
      <stop offset="0.55" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mascara-pontos">
      <rect width="600" height="500" fill="url(#esmaecer)"/>
    </mask>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cc99cc"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="url(#pontos)" mask="url(#mascara-pontos)"/>

  <!-- O frasco da logo, inteiro e dentro da área do desenho -->
  <g opacity="0.18" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round">
    <path d="M513 151 L553 111 L547 105 L585 143 L579 137 L539 177 Z"/>
    <circle cx="420" cy="270" r="150"/>
  </g>
  <g fill="#ffffff" opacity="0.14">
    <circle cx="370" cy="270" r="14"/><circle cx="420" cy="270" r="14"/><circle cx="470" cy="270" r="14"/>
  </g>

  <g font-family="Newsreader, Georgia, serif">
    <!-- tesoura + -aço -> tesouraço -->
    <g class="ilustracao__linha">
      <rect x="30" y="72" rx="10" width="104" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="82" y="102" text-anchor="middle" font-size="22" fill="#ffffff">tesoura</text>
      <text x="156" y="103" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="178" y="72" rx="10" width="76" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="216" y="102" text-anchor="middle" font-size="22" font-style="italic" fill="#ffffff">-aço</text>
      <path d="M216 124 C 216 160, 250 170, 290 172" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="300" y="146" rx="12" width="210" height="52" fill="#ffffff"/>
      <text x="405" y="180" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">tesouraço</text>
    </g>

    <!-- cripto + trambique -> criptotrambique -->
    <g class="ilustracao__linha">
      <rect x="30" y="234" rx="10" width="86" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="73" y="264" text-anchor="middle" font-size="22" fill="#ffffff">cripto</text>
      <text x="134" y="265" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="152" y="234" rx="10" width="116" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="210" y="264" text-anchor="middle" font-size="22" fill="#ffffff">trambique</text>
      <path d="M272 257 L 292 257" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="300" y="231" rx="12" width="236" height="52" fill="#ffffff" opacity="0.94"/>
      <text x="418" y="265" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">criptotrambique</text>
    </g>

    <!-- Faria Lima + -er -> farialimer -->
    <g class="ilustracao__linha">
      <rect x="30" y="350" rx="10" width="124" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5"/>
      <text x="92" y="380" text-anchor="middle" font-size="22" fill="#ffffff">Faria Lima</text>
      <text x="176" y="381" text-anchor="middle" font-size="24" fill="#cc99cc">+</text>
      <rect x="198" y="350" rx="10" width="60" height="46" fill="none" stroke="#cc99cc" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="228" y="380" text-anchor="middle" font-size="22" font-style="italic" fill="#ffffff">-er</text>
      <path d="M228 402 C 228 430, 255 440, 290 434" fill="none" stroke="#cc99cc" stroke-width="1.5" marker-end="url(#seta)"/>
      <rect x="300" y="410" rx="12" width="190" height="52" fill="#ffffff" opacity="0.9"/>
      <text x="395" y="444" text-anchor="middle" font-size="26" font-weight="600" fill="#660066">farialimer</text>
    </g>
  </g>

</svg>
