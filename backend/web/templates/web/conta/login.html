{% extends 'web/base.html' %}

{% block titulo %}Entrar — Neoscópio{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}

{% block conteudo %}
<div class="conteiner painel-conta">
  <div class="painel-conta__caixa">
    <h1 class="titulo-1">Entrar</h1>
    <p class="lead">Acesse para enviar e curtir neologismos.</p>

    {% if erro %}<p class="aviso aviso--error" role="alert">{{ erro }}</p>{% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="campo">
        <label class="campo__rotulo" for="username">Usuário</label>
        <input class="entrada" id="username" name="username" autocomplete="username" value="{{ usuario_digitado }}" autofocus>
      </div>
      <div class="campo">
        <div class="campo__cabeca">
          <label class="campo__rotulo" for="password">Senha</label>
          <a href="{% url 'web:recuperar_senha' %}">Esqueci a senha</a>
        </div>
        <div class="senha">
          <input class="entrada" id="password" name="password" type="password" autocomplete="current-password">
          <button class="senha__mostrar" type="button" data-mostrar-senha="password" hidden>Mostrar senha</button>
        </div>
      </div>
      <button class="botao" type="submit">Entrar</button>
    </form>

    <p class="painel-conta__rodape">Não tem conta? <a href="{% url 'web:cadastro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
