# Ambiente de DESENVOLVIMENTO: hot-reload, DEBUG ligado, sem HTTPS.
# Para produção use: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:17-alpine
    container_name: neologismo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin_neologismo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha123}
      POSTGRES_DB: ${POSTGRES_DB:-banco_neologismo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposto só na máquina local, para inspeção (ex.: DBeaver). Em todas as
      # interfaces, um servidor com este compose deixaria o banco aberto na
      # internet com a senha padrão.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_neologismo} -d ${POSTGRES_DB:-banco_neologismo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: final
    container_name: neologismo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-chave-de-desenvolvimento-nao-use-em-producao}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-admin_neologismo}:${POSTGRES_PASSWORD:-senha123}@db:5432/${POSTGRES_DB:-banco_neologismo}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Em dev os e-mails saem no log do container (backend do console).
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      # E-mail e login social, opcionais em desenvolvimento (sem EMAIL_HOST os
      # e-mails aparecem no log do backend).
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Neoscópio <nao-responda@localhost>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    volumes:
      # Hot-reload: reflete alterações do código local no container.
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  postgres_data:
