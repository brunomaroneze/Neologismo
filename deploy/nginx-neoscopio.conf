# Modelo de site do nginx para rodar com docker-compose.nginx.yml.
# Copie para /etc/nginx/sites-available/, troque o domínio e rode o Certbot
# (`certbot --nginx -d SEU-DOMINIO`), que acrescenta o bloco de HTTPS.
#
# O site inteiro (páginas, /api, /admin e /static) é servido pelo Django.

server {
    server_name SEU-DOMINIO;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sem este header o Django não sabe que a requisição veio por HTTPS
        # (SECURE_PROXY_SSL_HEADER) e o CSRF dos formulários falha.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
