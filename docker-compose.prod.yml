services:
  db:
    ports: !reset []

  backend:
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    command: npm run start
    volumes: !reset []
